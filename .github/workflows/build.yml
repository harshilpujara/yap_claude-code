name: Build Windows app

# Every push to main (and every PR) builds the installer as a downloadable artifact.
# Pushing a version tag such as v0.2.0 instead builds it with tauri-action and creates a
# DRAFT GitHub Release with the installer attached. Review and publish it by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the draft Release
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $app = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $app) { throw "Tag v$tag does not match the app version $app. Use 'npm run release -- $tag' to set it." }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm --prefix web ci

      # Branch pushes and PRs: plain build, installer kept as a workflow artifact.
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: yapp-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Version tags: build and attach the installer to a draft Release.
      - name: Build and create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: yapp ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. The installer is not code-signed yet; if Windows SmartScreen warns, click More info, then Run anyway.
          releaseDraft: true
          prerelease: false
